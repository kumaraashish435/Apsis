<header class="top-bar">
  <div class="top-bar__brand">
    <span class="top-bar__title">{{ title() }}</span>
    <span class="top-bar__divider" aria-hidden="true">|</span>
    <span class="top-bar__subtitle">{{ subtitle() }}</span>
  </div>

  <div class="top-bar__actions">
    <button
      type="button"
      class="top-bar__icon-btn"
      aria-label="System status"
      (click)="statusClick.emit()"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
        <path
          d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path d="M9.25 12.25l1.75 1.75L14.75 10" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      @if (alertCount() > 0) {
        <span class="top-bar__badge" aria-hidden="true"></span>
      }
    </button>

    <button
      type="button"
      class="top-bar__icon-btn"
      aria-label="Notifications"
      (click)="notificationsClick.emit()"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
        <path
          d="M6 10a6 6 0 1 1 12 0c0 4 1.5 5.5 1.5 5.5h-15S6 14 6 10z"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path d="M10 18.5a2 2 0 0 0 4 0" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>

    <button
      type="button"
      class="top-bar__icon-btn"
      aria-label="History"
      (click)="historyClick.emit()"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
        <path d="M12 7v5l3.25 1.9" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M4.5 12a7.5 7.5 0 1 1 2.35 5.45" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M4.5 8v4h4" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>

    <button type="button" class="top-bar__icon-btn" aria-label="Menu" (click)="menuClick.emit()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
        <path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round" />
      </svg>
    </button>
  </div>
</header>
