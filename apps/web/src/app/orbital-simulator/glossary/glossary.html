<section class="page">
  <div class="page__header">
    <div>
      <div class="page__title">Orbital mechanics glossary</div>
      <div class="page__subtitle">The terms used elsewhere in this app, explained</div>
    </div>
  </div>

  <div class="card glossary">
    @for (item of terms; track item.term) {
      <div class="glossary__entry">
        <dt>{{ item.term }}</dt>
        <dd>{{ item.definition }}</dd>
      </div>
    }
  </div>
</section>
