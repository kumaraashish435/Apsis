<div class="shell">
  <header class="shell__topbar">
    <span class="shell__brand">ASPIS</span>
    <nav class="shell__nav">
      @for (product of products; track product.path) {
        @if (product.active) {
          <a
            class="shell__nav-link"
            [routerLink]="product.path"
            routerLinkActive="shell__nav-link--active"
          >{{ product.label }}</a>
        } @else {
          <span class="shell__nav-link shell__nav-link--disabled" [title]="product.label + ' — not built yet'">
            {{ product.label }}
          </span>
        }
      }
    </nav>
  </header>

  <main class="shell__content">
    <router-outlet />
  </main>
</div>
